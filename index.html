<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E141B">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Finansovr</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#0E141B;color:#E6EBF1;font:15px/1.4 -apple-system,Roboto,"Segoe UI",Arial,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#0E141B}
  .tela{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  .tela img{width:84px;height:84px;border-radius:20px}
  .tela h1{margin:0;font-size:22px}
  .tela p{margin:0;color:#9AA8B8;font-size:14px;max-width:360px}
  input{width:100%;max-width:360px;font-size:15px;padding:12px;border-radius:10px;border:1px solid #344152;background:#111922;color:#E6EBF1}
  button{width:100%;max-width:360px;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:#3CC4B4;color:#0E141B}
  .err{color:#FF6B6B;font-size:13px;min-height:18px}
  .spin{width:34px;height:34px;border:4px solid #2A3542;border-top-color:#3CC4B4;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .hide{display:none!important}
</style>
</head>
<body>
  <!-- primeira vez: pede o link do app (fica salvo neste aparelho) -->
  <div class="tela hide" id="config">
    <img src="icon-192.png" alt="">
    <h1>Finansovr</h1>
    <p>Cole o link do app do Apps Script (o da implantação, que termina em <b>/exec</b>). Ele fica salvo só neste aparelho.</p>
    <input id="url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec">
    <div class="err" id="err"></div>
    <button onclick="salvar()">Abrir o app</button>
  </div>

  <!-- carregando -->
  <div class="tela" id="carregando">
    <img src="icon-192.png" alt="">
    <div class="spin"></div>
    <p>Abrindo…</p>
  </div>

  <iframe id="app" title="Finansovr" allow="clipboard-write"></iframe>

<script>
  const KEY = 'finansovr.appUrl';
  const ler = () => { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } };
  const gravar = (v) => { try { localStorage.setItem(KEY, v); } catch (e) {} };

  function valido(u) { return /^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[A-Za-z0-9_-]+\/exec\/?$/.test(u.trim()); }

  function abrir(u) {
    document.getElementById('config').classList.add('hide');
    document.getElementById('carregando').classList.remove('hide');
    const f = document.getElementById('app');
    f.onload = () => { document.getElementById('carregando').classList.add('hide'); f.style.display = 'block'; };
    f.src = u.trim();
  }

  function salvar() {
    const u = document.getElementById('url').value.trim();
    if (!valido(u)) { document.getElementById('err').textContent = 'Link inválido: precisa começar com https://script.google.com/macros/s/ e terminar em /exec.'; return; }
    gravar(u); abrir(u);
  }

  // ?trocar na URL = esquecer o link salvo e pedir de novo
  if (new URLSearchParams(location.search).has('trocar')) { try { localStorage.removeItem(KEY); } catch (e) {} }

  const salvo = ler();
  if (salvo && valido(salvo)) abrir(salvo);
  else { document.getElementById('carregando').classList.add('hide'); document.getElementById('config').classList.remove('hide'); }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
