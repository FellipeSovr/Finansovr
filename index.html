<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1C42">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Finansovr</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;color:#FFFFFF;font:15px/1.45 Sora,-apple-system,Roboto,"Segoe UI",Arial,sans-serif;overflow:hidden;
    background:#0A1533 linear-gradient(170deg,#1A2B5C 0%,#111F47 30%,#0A1533 65%,#060C22 100%)}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#0A1533}
  .tela{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
  .tela img{width:92px;height:92px;border-radius:24px;box-shadow:0 0 0 8px rgba(127,166,255,.10),0 12px 40px rgba(0,0,0,.45)}
  .tela h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
  .tela p{margin:0;color:#B7C3E0;font-size:14px;max-width:360px}
  input{width:100%;max-width:360px;font:15px inherit;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff}
  button{width:100%;max-width:360px;border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:600;background:linear-gradient(145deg,#FFFFFF,#D6E2FF);color:#16306F}
  .err{color:#FF9DB0;font-size:13px;min-height:18px}
  .barra{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
  .barra i{display:block;width:45%;height:100%;border-radius:2px;background:linear-gradient(90deg,transparent,#A9C4FF,#FFFFFF,transparent);animation:c 1.1s ease-in-out infinite}
  @keyframes c{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
  .hide{display:none!important}
</style>
</head>
<body>
  <!-- primeira vez: pede o link do app (fica salvo neste aparelho) -->
  <div class="tela hide" id="config">
    <img src="icon-192.png" alt="">
    <h1>Finansovr</h1>
    <p>Cole o link do app do Apps Script (o da implantação, que termina em <b>/exec</b>). Ele fica salvo só neste aparelho.</p>
    <input id="url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec">
    <div class="err" id="err"></div>
    <button onclick="salvar()">Abrir o app</button>
  </div>

  <!-- carregando -->
  <div class="tela" id="carregando">
    <img src="icon-192.png" alt="">
    <h1>Finansovr</h1>
    <div class="barra"><i></i></div>
  </div>

  <iframe id="app" title="Finansovr" allow="clipboard-write"></iframe>

<script>
  const KEY = 'finansovr.appUrl';
  const ler = () => { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } };
  const gravar = (v) => { try { localStorage.setItem(KEY, v); } catch (e) {} };

  function valido(u) { return /^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[A-Za-z0-9_-]+\/exec\/?$/.test(u.trim()); }

  function abrir(u) {
    document.getElementById('config').classList.add('hide');
    document.getElementById('carregando').classList.remove('hide');
    const f = document.getElementById('app');
    f.onload = () => { document.getElementById('carregando').classList.add('hide'); f.style.display = 'block'; };
    f.src = u.trim();
  }

  function salvar() {
    const u = document.getElementById('url').value.trim();
    if (!valido(u)) { document.getElementById('err').textContent = 'Link inválido: precisa começar com https://script.google.com/macros/s/ e terminar em /exec.'; return; }
    gravar(u); abrir(u);
  }

  // ?trocar na URL = esquecer o link salvo e pedir de novo
  if (new URLSearchParams(location.search).has('trocar')) { try { localStorage.removeItem(KEY); } catch (e) {} }

  const salvo = ler();
  if (salvo && valido(salvo)) abrir(salvo);
  else { document.getElementById('carregando').classList.add('hide'); document.getElementById('config').classList.remove('hide'); }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
